<!-- Logout Button (Place inside sidebar or nav) -->
<button type="button" class="logout-btn" id="openLogoutModal">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
    <polyline points="16 17 21 12 16 7"></polyline>
    <line x1="21" y1="12" x2="9" y2="12"></line>
  </svg>
  <span>Log Out</span>
</button>

<!-- Modal Backdrop & Card -->
<div class="logout-modal-backdrop" id="logoutModal">
  <div class="logout-card">
    <div class="modal-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </div>
    <h3>Sign Out of AgriLink LK?</h3>
    <p>Are you sure you want to end your active session?</p>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="cancelLogout">Cancel</button>
      <button type="button" class="btn-confirm-logout" id="confirmLogout">Yes, Log Out</button>
    </div>
  </div>
</div>

<style>
  .logout-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: transparent;
    color: #dc2626;
    border: 1px solid #fecaca;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover {
    background: #fef2f2;
    border-color: #dc2626;
  }

  /* Modal styling */
  .logout-modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(4px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .logout-modal-backdrop.active {
    display: flex;
  }
  .logout-card {
    background: #ffffff;
    max-width: 380px;
    width: 100%;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    text-align: center;
  }
  .modal-icon {
    width: 52px;
    height: 52px;
    background: #fee2e2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px auto;
  }
  .logout-card h3 {
    font-size: 1.15rem;
    color: #0f172a;
    margin-bottom: 8px;
  }
  .logout-card p {
    font-size: 0.875rem;
    color: #64748b;
    margin-bottom: 20px;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
  }
  .btn-cancel, .btn-confirm-logout {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
  }
  .btn-cancel {
    background: #f1f5f9;
    color: #334155;
  }
  .btn-cancel:hover { background: #e2e8f0; }
  .btn-confirm-logout {
    background: #dc2626;
    color: #ffffff;
  }
  .btn-confirm-logout:hover { background: #b91c1c; }
</style>

<script>
  const openBtn = document.getElementById('openLogoutModal');
  const modal = document.getElementById('logoutModal');
  const cancelBtn = document.getElementById('cancelLogout');
  const confirmBtn = document.getElementById('confirmLogout');

  openBtn.addEventListener('click', () => modal.classList.add('active'));
  cancelBtn.addEventListener('click', () => modal.classList.remove('active'));

  // Close when clicking outside the card
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('active');
  });

  confirmBtn.addEventListener('click', () => {
    // 1. Clear local/session storage auth tokens
    localStorage.removeItem('agrilink_token');
    localStorage.removeItem('agrilink_user');
    sessionStorage.clear();

    // 2. Redirect to login
    window.location.href = 'login.html';
  });
</script>
